# Build the app on GitHub's Mac and put it on TestFlight.
#
# The point of this file: the iOS SDK ships only inside Xcode, and Xcode will not
# install on macOS 13.4. GitHub's macOS runners already have both. So the laptop
# stays as it is, the runner does the compiling, and the app arrives on a phone
# through TestFlight.
#
# What has to exist before the first run, once:
#
#  1. This directory pushed to a GitHub repository.
#  2. An App Store Connect API key: App Store Connect > Users and Access >
#     Integrations > App Store Connect API > generate a team key with the App
#     Manager role. It downloads a .p8 file once and never again, so keep it.
#  3. An app record in App Store Connect with bundle id com.impktband.pilot,
#     and that same bundle id registered under Certificates, Identifiers &
#     Profiles. Automatic signing below creates the certificate and profile
#     itself, which is what keeps this free of the usual certificate wrangling.
#  4. Four repository secrets, under Settings > Secrets and variables > Actions:
#       ASC_KEY_ID      the key's ten-character id
#       ASC_ISSUER_ID   the issuer uuid shown above the key list
#       ASC_KEY_P8      the .p8 file's contents, base64: base64 -i key.p8 | pbcopy
#       APPLE_TEAM_ID   your ten-character team id
#
# After that a push to main produces a TestFlight build. Adding a tester is an
# email address in App Store Connect, including one in another country, which is
# the whole reason this exists.

name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode is not always its newest, and two things depend
      # on getting the newest: current XcodeGen writes a project format that only
      # Xcode 16 and later can open, and App Store Connect refuses an upload built
      # against an old SDK. Picking the highest installed version by number keeps
      # working when GitHub rolls the image forward.
      - name: Use the newest Xcode on the runner
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      # The page and the firmware zip are committed rather than fetched: the
      # runner has no copy of the website or of boxing-fw. sync-web.sh is what
      # refreshes them locally before a commit, so what ships is always what was
      # last built and tested on the bench.
      - name: Check the bundled resources are there
        run: |
          test -f IMPKT/Resources/Web/index.html || { echo "the pilot page is missing: run ./sync-web.sh and commit it"; exit 1; }
          test -f IMPKT/Resources/firmware.zip  || { echo "the firmware package is missing: run ./sync-web.sh and commit it"; exit 1; }
          echo "firmware in this build: $(cat IMPKT/Resources/firmware-version.txt)"

      # Compiles everything and resolves the Nordic package, with no certificate
      # and no Apple account involved. It runs before the signed build on purpose:
      # a syntax error and a missing credential look identical in an archive log,
      # and this step tells them apart in two minutes.
      - name: Compile check
        run: |
          xcodebuild -project IMPKT.xcodeproj \
            -scheme IMPKT \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The signed half needs all four secrets. Until they are all set the build
      # stops here rather than failing in a signing log, which is a much harder
      # place to read "you have not finished the setup yet".
      - name: Are the credentials there
        id: creds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the app compiled, but nothing was uploaded: missing secrets$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The name matters. xcodebuild takes any path, but altool searches a fixed
      # list of directories for a file called exactly AuthKey_<key id>.p8 and
      # reports "could not be found" for anything else, which reads like a missing
      # secret rather than a filename.
      - name: Write the App Store Connect key
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          test -s ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      # Automatic signing on a fresh runner does not reuse a certificate, it makes
      # one: the keychain is empty, so there is nothing to reuse. Apple caps a team
      # at ten Apple Development certificates, so the eleventh push fails with
      # "Choose a certificate to revoke. Your account has reached the maximum
      # number of certificates", which is a signing error with nothing wrong with
      # the signing. That is what happened after fourteen builds.
      #
      # Every certificate those runs left is already dead: the private key was in
      # the runner's keychain and the runner was destroyed, so what is on the
      # account is a public half nothing can sign with. They are swept here rather
      # than allowed to pile up, which holds the count at one.
      #
      # continue-on-error, because a hiccup talking to Apple should not fail a
      # build that has room to sign anyway. If there is no room, the archive says
      # so in the next step and says it in Apple's own words.
      - name: Clear the dead certificates the last builds left on the account
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            python3 tools/asc.py sweep-certs

      # The build number is the run number, so every upload is higher than the
      # last one. App Store Connect rejects a repeat, and hand-bumping a number
      # in a plist is the thing everyone forgets.
      - name: Archive
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project IMPKT.xcodeproj \
            -scheme IMPKT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/IMPKT.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      # The page loads its stylesheet, its font and the activation gate's pilot
      # list by relative path, and a wrong path is not a build error: the app
      # installs and shows an unstyled page that cannot check a code. Nothing in
      # the compiler catches that, so the built bundle is inspected instead.
      - name: Check the page's own files survived the build
        if: steps.creds.outputs.ready == 'true'
        run: |
          APP=build/IMPKT.xcarchive/Products/Applications/IMPKT.app
          fail=0
          for f in Web/index.html css/pilot.css pilots.json firmware.zip bridge.js; do
            if [ -f "$APP/$f" ]; then
              echo "ok   $f"
            else
              echo "MISSING $f"; fail=1
            fi
          done
          ls "$APP"/fonts/*.woff2 >/dev/null 2>&1 && echo "ok   fonts" \
            || { echo "MISSING fonts"; fail=1; }
          test -f "$APP/AppIcon60x60@2x.png" && echo "ok   icon" \
            || echo "note: no 120px icon in the bundle, validation will say so"
          exit $fail

      - name: Export the ipa
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/TEAM_ID_HERE/$APPLE_TEAM_ID/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/IMPKT.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # altool exits 0 after printing "UPLOAD FAILED", so its exit code alone
          # turns a rejected build into a green tick. The output decides instead:
          # a run is only successful if Apple actually took the build.
          set -o pipefail
          xcrun altool --upload-app -f build/ipa/IMPKT.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log
          if grep -q "UPLOAD FAILED" upload.log; then
            echo "::error::App Store Connect refused the build, see the errors above"
            exit 1
          fi
          grep -q "No errors uploading" upload.log \
            || { echo "::error::altool did not confirm the upload"; exit 1; }

      # Kept whatever happens to the upload: a build that compiled but would not
      # upload is a credentials problem, and the ipa is the proof of that rather
      # than something to rebuild.
      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMPKT-ipa
          path: build/ipa
          if-no-files-found: warn
