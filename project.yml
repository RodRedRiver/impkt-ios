# XcodeGen project definition. `brew install xcodegen && xcodegen generate` turns
# this into IMPKT.xcodeproj, which is faster and far less error prone than a
# hand-written project file, and it means the project can be regenerated rather
# than merged. The README has the by-hand route in Xcode as well.
name: IMPKT
options:
  bundleIdPrefix: com.impktband
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  # Nordic's own iOS implementation of the DFU protocol the wraps speak. The
  # firmware uses the legacy (SDK 11) DFU service, which this library supports
  # alongside secure DFU, so the zip built by ./build.sh dfu-zip is what it wants.
  NordicDFU:
    url: https://github.com/NordicSemiconductor/IOS-DFU-Library
    from: 4.15.0

targets:
  IMPKT:
    type: application
    platform: iOS
    sources:
      - path: IMPKT
        excludes:
          - "Resources/Web"
          - "Resources/css"
          - "Resources/fonts"
          - "Resources/Beta"
      # Folder references, not groups. A group flattens its contents into the
      # bundle root, so css/pilot.css would arrive as pilot.css and the page's
      # own ../css/pilot.css would find nothing. The page's paths are the
      # requirement here, and they are the website's paths.
      - path: IMPKT/Resources/Web
        type: folder
      - path: IMPKT/Resources/css
        type: folder
      - path: IMPKT/Resources/fonts
        type: folder
      # The Beta tab's app, built from beta/ by sync-beta.sh. A folder for the same
      # reason as Web: its pages ask for /Beta/assets/..., and a group would flatten that.
      - path: IMPKT/Resources/Beta
        type: folder
    dependencies:
      - package: NordicDFU
    settings:
      base:
        INFOPLIST_FILE: IMPKT/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.impktband.pilot
        # One 1024 png in the catalog and Xcode makes every size the phone and the
        # store ask for. tools/make-icon.py draws it from the site's own mark.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""   # set this in Xcode once, Signing & Capabilities
